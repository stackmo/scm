version: "3.9"

services:
  orthanc:
    image: orthancteam/orthanc:24.11.2
    container_name: scm-orthanc-pacs
    restart: unless-stopped
    ports:
      - "4242:4242" # DICOM C-STORE / C-FIND / MWL cho máy X-Quang DR, CT, Siêu âm
      - "8042:8042" # HTTP API nội bộ (chỉ bind LAN hoặc qua Nginx Proxy)
    volumes:
      - orthanc_db:/var/lib/orthanc/db
      - ./orthanc.json:/etc/orthanc/orthanc.json:ro
      - ./orthanc-webhook.lua:/etc/orthanc/orthanc-webhook.lua:ro
    environment:
      - SCM_WEBHOOK_URL=http://host.docker.internal:5000/api/ris-pacs/pacs-webhook/study-stable
      - SCM_PACS_WEBHOOK_SECRET=SCM-PACS-SECRET-2026
    networks:
      - pacs_net

  ohif-viewer:
    image: ohif/app:v3.8.3
    container_name: scm-ohif-viewer
    restart: unless-stopped
    volumes:
      - ./ohif-config.js:/usr/share/nginx/html/app-config.js:ro
    networks:
      - pacs_net

  pacs-proxy:
    image: nginx:1.27-alpine
    container_name: scm-pacs-nginx-proxy
    restart: unless-stopped
    ports:
      - "8088:80"
    volumes:
      - ./nginx-pacs-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - orthanc
      - ohif-viewer
    networks:
      - pacs_net

volumes:
  orthanc_db:

networks:
  pacs_net:
    driver: bridge
