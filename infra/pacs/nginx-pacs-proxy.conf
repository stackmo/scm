# Nginx Reverse Proxy bảo vệ Orthanc DICOMweb + OHIF Viewer (INV-GW-03)
# Kiểm tra JWT/Session & quyền tab_imaging_capture / tab_lead_summary qua auth_request tới SCM Backend

upstream scm_api {
    server host.docker.internal:5000;
}

upstream orthanc_upstream {
    server orthanc:8042;
}

upstream ohif_upstream {
    server ohif-viewer:80;
}

server {
    listen 80;
    server_name _;

    # Internal subrequest xác thực RBAC từ SCM Backend
    location = /_pacs_auth_check {
        internal;
        proxy_pass http://scm_api/api/rbac/my-context;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-User-Id $http_x_user_id;
        proxy_set_header X-User-Name $http_x_user_name;
        proxy_set_header X-Branch-Code $http_x_branch_code;
        proxy_set_header Authorization $http_authorization;
    }

    # Protected DICOMweb Proxy (QIDO-RS / WADO-RS / STOW-RS)
    location /api/pacs-proxy/dicom-web/ {
        auth_request /_pacs_auth_check;
        rewrite ^/api/pacs-proxy/dicom-web/(.*)$ /dicom-web/$1 break;
        proxy_pass http://orthanc_upstream;
        proxy_set_header Authorization "Basic c2NtX3BhY3M6U2NtUGFjc0AyMDI2";
        proxy_set_header Host $host;
        client_max_body_size 512M;
    }

    location /api/pacs-proxy/wado {
        auth_request /_pacs_auth_check;
        rewrite ^/api/pacs-proxy/wado(.*)$ /wado$1 break;
        proxy_pass http://orthanc_upstream;
        proxy_set_header Authorization "Basic c2NtX3BhY3M6U2NtUGFjc0AyMDI2";
        proxy_set_header Host $host;
    }

    # OHIF Zero-Footprint Viewer
    location /pacs/ohif/ {
        auth_request /_pacs_auth_check;
        rewrite ^/pacs/ohif/(.*)$ /$1 break;
        proxy_pass http://ohif_upstream;
        proxy_set_header Host $host;
    }
}
